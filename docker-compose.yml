# Starts a local Postgres server for this project. You said you're starting
# from zero, so this is the fastest path: `docker compose up -d` and you
# have a real Postgres instance on localhost:5432 matching .env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: notes-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10
